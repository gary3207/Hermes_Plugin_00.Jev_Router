<style>
  .jr { font-size: 13px; color: var(--foreground); max-width: 820px; }
  .jr h3 { margin: 0 0 4px; font-size: 15px; }
  .jr .muted { color: var(--muted-foreground); }
  .jr .bar { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  .jr input[type=search] { flex: 1; min-width: 180px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: inherit; }
  .jr details { border: 1px solid var(--border); border-radius: 8px; margin: 6px 0; background: var(--card); }
  .jr summary { cursor: pointer; padding: 7px 10px; font-weight: 600; }
  .jr summary .muted { font-weight: 400; }
  .jr .row { display: grid; grid-template-columns: minmax(200px, auto) 1fr; gap: 10px; align-items: baseline; padding: 3px 10px; }
  .jr .row:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .jr .row code { font-size: 12px; }
  .jr .facts { font-size: 11px; }
  .jr button { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--card); cursor: pointer; font-weight: 600; }
  .jr button:disabled { opacity: .5; cursor: default; }
  .jr .msg { margin: 6px 0; padding: 6px 10px; border-left: 3px solid var(--accent); white-space: pre-wrap; }
  .jr .warn { border-left-color: #d97706; background: color-mix(in srgb, #d97706 10%, transparent); }
</style>
<div class="jr">
  <h3>jev-router 사용 허용 모델</h3>
  <div class="muted" id="intro"></div>
  <div id="msg"></div>
  <div class="bar">
    <input type="search" id="q" placeholder="모델 검색 (예: haiku, gpt-6)" aria-label="모델 검색">
    <span class="muted" id="count"></span>
    <button id="save">저장</button>
  </div>
  <div id="list"></div>
</div>
<script>
(() => {
  const DATA = __DATA__;
  const F = Object.assign({ effort: "medium", bench: {}, quota: {} }, DATA.facts);
  const key = (p, m) => p + "/" + m;
  const chosen = new Set(DATA.saved.map(c => key(c.provider, c.model)));
  const list = document.getElementById("list");
  document.getElementById("intro").textContent =
    `쓸 수 있게 허용할 모델만 체크하세요. 작업마다 어떤 모델을 쓸지는 Jev가 아래 벤치마크(Artificial Analysis, effort=${F.effort} 기준)와 구독 잔량을 보고 고릅니다.`;
  const note = (text, cls) => { const m = document.createElement("div"); m.className = cls; m.setAttribute("role", "status"); m.textContent = text; document.getElementById("msg").append(m); };
  if (F.aa_help) note("⚠ " + F.aa_help, "msg warn");
  if (DATA.message) note(DATA.message, "msg");

  for (const [prov, models] of Object.entries(DATA.available)) {
    const det = document.createElement("details");
    det.open = models.some(m => chosen.has(key(prov, m)));
    const sum = document.createElement("summary"), note = document.createElement("span");
    note.className = "muted"; note.textContent = ` (${models.length}) · ${F.quota[prov] || "잔량 정보 없음"}`;
    sum.append(prov, note); det.append(sum);
    for (const model of models) {
      const k = key(prov, model), row = document.createElement("div"), lab = document.createElement("label");
      row.className = "row"; row.dataset.text = k.toLowerCase();
      const cb = Object.assign(document.createElement("input"), { type: "checkbox", checked: chosen.has(k) });
      cb.addEventListener("change", () => { cb.checked ? chosen.add(k) : chosen.delete(k); count(); });
      const name = document.createElement("code"); name.textContent = model;
      const facts = document.createElement("span"); facts.className = "facts muted"; facts.textContent = F.bench[k] || "";
      lab.append(cb, " ", name); row.append(lab, facts); det.append(row);
    }
    list.append(det);
  }

  function count() { document.getElementById("count").textContent = `선택 ${chosen.size}개`; }
  document.getElementById("q").addEventListener("input", e => {
    const q = e.target.value.trim().toLowerCase();
    list.querySelectorAll("details").forEach(d => {
      let any = false;
      d.querySelectorAll(".row").forEach(r => { const hit = !q || r.dataset.text.includes(q); r.style.display = hit ? "" : "none"; any ||= hit; });
      d.style.display = any ? "" : "none"; if (q) d.open = any;
    });
  });
  document.getElementById("save").addEventListener("click", e => {
    const candidates = [...chosen].map(k => { const i = k.indexOf("/"); return { provider: k.slice(0, i), model: k.slice(i + 1) }; });
    if (!candidates.length) { alert("모델을 하나 이상 선택하세요."); return; }
    e.target.disabled = true; e.target.textContent = "저장 요청 중…";
    window.hermes.send("jev-router save " + JSON.stringify({ candidates }));
  });
  count();
})();
</script>
